name: release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GAMELIBS_PAT: ${{ secrets.GAMELIBS_PAT }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build SettlementPlacementAdvisor.csproj -c Release

      - name: Test
        run: dotnet test tests -c Release

      - name: Generate config
        run: |
          mkdir -p dist
          set -o pipefail
          bash scripts/gen-cfg.sh "${GITHUB_REF_NAME#v}" | tee dist/cfggen-report.txt
          grep -q '^game build: [0-9]' dist/cfggen-report.txt
          game_build="$(sed -n 's/^game build: \([0-9][0-9.]*\).*/\1/p' dist/cfggen-report.txt)"
          test -n "$game_build"
          echo "GAME_BUILD=$game_build" >> "$GITHUB_ENV"

      - name: Package zip
        run: |
          ver="${GITHUB_REF_NAME#v}"
          echo "VERSION=${ver}" >> "$GITHUB_ENV"
          mkdir -p dist/pkg
          cp bin/Release/SettlementPlacementAdvisor.dll LICENSE README.md \
             dist/com.jabulba.settlementplacementadvisor.cfg dist/pkg/
          (cd dist/pkg && zip -q "../SettlementPlacementAdvisor-${ver}.zip" *)
          test -f "dist/SettlementPlacementAdvisor-${ver}.zip"

      - name: Install git-cliff
        run: |
          curl -fsSL -o /tmp/gc.tgz \
            https://github.com/orhun/git-cliff/releases/download/v2.14.2/git-cliff-2.14.2-x86_64-unknown-linux-gnu.tar.gz
          mkdir -p /tmp/gc
          tar -xzf /tmp/gc.tgz -C /tmp/gc
          gc="$(find /tmp/gc -type f -name git-cliff -perm -u+x -print -quit)"
          test -x "$gc"
          echo "GIT_CLIFF=$gc" >> "$GITHUB_ENV"

      - name: Release notes
        run: |
          "$GIT_CLIFF" --current --tag "${GITHUB_REF_NAME}" -o dist/release-notes.md
          cat >> dist/release-notes.md <<'EOF'

          ## Install

          Unzip into `<game>/BepInEx/plugins/`. Copy the cfg to `<game>/BepInEx/config/` to tune
          the advisor; without it the game generates the same defaults. The mod loads at game
          start; restart after installing.
          EOF
          { printf 'Built for HUMANKIND %s.\n\n' "$GAME_BUILD"; cat dist/release-notes.md; } > dist/notes-head.md
          mv dist/notes-head.md dist/release-notes.md

      - uses: softprops/action-gh-release@v2
        with:
          name: SPA ${{ env.VERSION }}
          body_path: dist/release-notes.md
          files: dist/SettlementPlacementAdvisor-${{ env.VERSION }}.zip
